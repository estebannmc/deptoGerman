<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
  <title>Depto German</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H19v-8h-6v8H4z' fill='%23c2410c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <h1>Depto German</h1>
    <nav class="pestanas" role="tablist">
      <button role="tab" data-vista="cola" aria-selected="true">Para ver <span data-cuenta="cola"></span></button>
      <button role="tab" data-vista="si" aria-selected="false">Me gustan <span data-cuenta="si"></span></button>
      <button role="tab" data-vista="todas" aria-selected="false">Todas</button>
    </nav>
  </header>

  <p class="aviso" id="aviso" hidden></p>

  <main>
    <section id="vista-cola" class="vista">
      <div class="mazo" id="mazo" aria-live="polite"></div>
      <div class="acciones" id="acciones">
        <button class="accion no" data-voto="no" aria-label="No me gusta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="accion deshacer" id="deshacer" aria-label="Deshacer el último voto" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4v5"/><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8"/></svg>
        </button>
        <button class="accion quizas" data-voto="quizas" aria-label="Quizás">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V15"/><path d="M12 18.5v.01"/></svg>
        </button>
        <button class="accion si" data-voto="si" aria-label="Me gusta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        </button>
      </div>
      <p class="ayuda">Deslizá a la derecha si te gusta, a la izquierda si no, o la foto hacia arriba si lo dudás.</p>
    </section>

    <section id="vista-lista" class="vista" hidden>
      <ul class="lista" id="lista"></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <template id="tpl-tarjeta">
    <article class="tarjeta">
      <div class="foto">
        <img alt="" referrerpolicy="no-referrer">
        <span class="sello sello-si">Me gusta</span>
        <span class="sello sello-no">No</span>
        <span class="sello sello-quizas">Quizás</span>
        <span class="tipo"></span>
      </div>
      <div class="cuerpo">
        <p class="precio"></p>
        <h2 class="titulo"></h2>
        <p class="ubicacion"></p>
        <ul class="criterios"></ul>
        <dl class="datos"></dl>
        <p class="estado"></p>
        <a class="ver" target="_blank" rel="noopener">Ver aviso</a>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
